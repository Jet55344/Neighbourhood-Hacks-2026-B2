<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<title>Ramble Calendar</title>

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg1:#f7f6f1;--bg2:#ecebe4;--ink:#101828;--mut:#5b6678;--g1:rgba(255,255,255,.62);--g2:rgba(255,255,255,.2);--gb:rgba(255,255,255,.75);--hi:rgba(255,255,255,.95);--sh:rgba(40,60,100,.14);--blue:#0a6cff;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#12151c;--bg2:#0c0e13;--ink:#f2f4f8;--mut:#9aa6ba;--g1:rgba(255,255,255,.16);--g2:rgba(255,255,255,.05);--gb:rgba(255,255,255,.25);--hi:rgba(255,255,255,.4);--sh:rgba(0,0,0,.4);color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg1)}
.blob{position:fixed;border-radius:50%;filter:blur(60px);opacity:.6;z-index:0;pointer-events:none;animation:drift 18s ease-in-out infinite alternate}
.b1{width:340px;height:340px;background:#8fd3ff;left:6%;top:8%}.b2{width:300px;height:300px;background:#a6efc9;right:6%;bottom:10%;animation-delay:-6s}.b3{width:240px;height:240px;background:#ffb3c1;left:40%;top:55%;opacity:.35;animation-delay:-11s}
@keyframes drift{to{transform:translate(60px,-40px) scale(1.15)}}
.glass{background:linear-gradient(135deg,var(--g1),var(--g2));backdrop-filter:blur(22px) saturate(190%);-webkit-backdrop-filter:blur(22px) saturate(190%);border:1px solid var(--gb);box-shadow:inset 0 1.5px 1px var(--hi),inset 0 -1px 2px rgba(255,255,255,.25),0 10px 34px var(--sh)}
.btn{font:600 13px inherit;font-family:inherit;color:var(--ink);cursor:pointer;border-radius:999px;padding:9px 16px;transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .2s}
.btn:hover{transform:translateY(-1px) scale(1.04)}.btn:active{transform:scale(.95)}
.ic{width:40px;height:40px;padding:0;display:inline-grid;place-items:center}
.ic svg{width:18px;height:18px}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pri{background:linear-gradient(180deg,rgba(70,150,255,.9),rgba(10,108,255,.75));color:#fff;border-color:rgba(255,255,255,.55);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.7),0 6px 22px rgba(10,108,255,.4)}
main{position:relative;z-index:1;padding:20px 16px 130px;max-width:1180px;margin:0 auto}
.page{display:none;animation:in .45s cubic-bezier(.22,1,.36,1)}.page.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.985)}}
.card{border-radius:28px;padding:22px}
h1,h2{margin:0}h1{font-size:28px;letter-spacing:-.02em}h2{font-size:18px}
.mut{color:var(--mut)}.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}
/* calendar */
.cal{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:20px;align-items:start}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.dow{margin:18px 0 8px;font-size:11px;font-weight:700;color:var(--mut);text-align:center;letter-spacing:.06em}
.cell{min-height:74px;border-radius:18px;padding:9px 10px;cursor:pointer;font-weight:700;font-size:13px;position:relative;transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.cell:hover{transform:scale(1.05)}.cell.o{opacity:.45}.cell.sel{outline:2px solid var(--blue);outline-offset:-2px}
.cell .n{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:99px}
.cell.today .n{background:var(--blue);color:#fff}
.bdg{position:absolute;right:8px;top:9px;font-size:11px;background:rgba(10,108,255,.18);color:var(--blue);border-radius:99px;padding:2px 7px}
.ev{border-radius:18px;padding:12px 14px;margin-top:10px;font-size:13px}
.chip{font-size:11px;font-weight:700;border-radius:99px;padding:2px 9px;background:rgba(10,108,255,.15);color:var(--blue)}
.empty{text-align:center;padding:22px 12px;margin-top:12px;border-radius:20px}
.empty svg{width:28px;height:28px;color:var(--mut)}
/* search */
.sbox{max-width:640px;margin:14vh auto 0;border-radius:30px;padding:14px 14px 14px 24px}
.sbox input{flex:1;min-width:0;background:none;border:0;outline:0;font:500 16px inherit;font-family:inherit;color:var(--ink);padding:10px 0}
.res{max-width:640px;margin:20px auto 0}
/* ramble */
.rtop{min-height:calc(100vh - 170px);display:flex;flex-direction:column;align-items:center;text-align:center}
.orb{--c:40,210,150;width:132px;height:132px;border-radius:50%;border:1.5px solid rgba(255,255,255,.85);cursor:pointer;margin:40px 0 18px;position:relative;display:grid;place-items:center;color:rgb(var(--c));
background:radial-gradient(circle at 50% 118%,rgba(var(--c),.75),rgba(var(--c),0) 62%),radial-gradient(circle at 28% 22%,rgba(255,255,255,.7),rgba(255,255,255,0) 40%),rgba(255,255,255,.08);
backdrop-filter:blur(8px) saturate(220%) brightness(1.08);-webkit-backdrop-filter:blur(8px) saturate(220%) brightness(1.08);
box-shadow:inset 0 3px 6px rgba(255,255,255,.95),inset 0 -14px 26px rgba(var(--c),.4),inset 10px 0 18px rgba(255,255,255,.18),0 0 60px rgba(var(--c),.45),0 18px 40px rgba(0,0,0,.1);transition:--c .3s,box-shadow .4s,transform .3s cubic-bezier(.34,1.56,.64,1)}
.orb::before{content:"";position:absolute;left:18%;right:18%;top:5%;height:30%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,0));opacity:.8}
.orb::after{content:"";position:absolute;left:30%;right:30%;bottom:6%;height:14%;border-radius:50%;background:radial-gradient(ellipse,rgba(255,255,255,.7),transparent 70%);filter:blur(2px)}
.orb svg{width:44px;height:44px;stroke-width:2;position:relative;z-index:1;filter:drop-shadow(0 2px 4px rgba(255,255,255,.7))}
.orb:hover{transform:scale(1.06)}.orb:active{transform:scale(.94)}
.orb.rec{--c:255,69,69;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.live{width:min(640px,100%);min-height:130px;border-radius:24px;padding:16px 18px;text-align:left;font-size:15px;line-height:1.55;white-space:pre-wrap}
.note{border-radius:22px;padding:16px 18px;margin-top:12px}.note p{margin:8px 0 0;line-height:1.55;font-size:14px}
.notes{max-width:760px;margin:0 auto}
/* timetable */
.tt{max-width:780px;margin:0 auto}
.hr{display:grid;grid-template-columns:78px 1fr;gap:10px;border-radius:16px;padding:10px 12px;margin-top:8px;min-height:54px}
.hr .t{font:600 11px ui-monospace,Menlo,monospace;color:var(--mut);padding-top:4px;border-right:1px solid var(--gb)}
.tb{border-radius:12px;padding:7px 11px;margin-bottom:4px;font-size:13px;background:rgba(10,108,255,.16);border:1px solid rgba(10,108,255,.3)}
/* nav */
nav{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;display:flex;padding:6px;border-radius:999px;gap:2px}
nav button{position:relative;z-index:1;width:62px;height:46px;border:0;background:none;border-radius:99px;cursor:pointer;color:var(--mut);display:grid;place-items:center;transition:color .3s}
nav button.on{color:var(--blue)}nav svg{width:21px;height:21px}
#ind{position:absolute;left:6px;top:6px;width:62px;height:46px;border-radius:99px;background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(160,205,255,.35));border:1px solid rgba(255,255,255,.9);box-shadow:inset 0 1.5px 1px #fff,0 4px 16px rgba(10,108,255,.28);transition:transform .6s cubic-bezier(.3,1.5,.5,1),width .35s cubic-bezier(.3,1.4,.5,1)}
/* modal */
.mask{position:fixed;inset:0;z-index:40;background:rgba(20,30,50,.3);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;place-items:center;padding:16px}
.mask.on{display:grid}.mask .card{width:min(440px,100%);max-height:92vh;overflow:auto;animation:in .35s cubic-bezier(.22,1,.36,1)}
.lbl{display:block;font-size:11px;font-weight:700;color:var(--mut);letter-spacing:.06em;margin:14px 0 6px;text-transform:uppercase}
.fld{width:100%;border-radius:14px;padding:11px 13px;font:500 14px inherit;font-family:inherit;color:var(--ink);outline:0}
.seg{display:flex;flex-wrap:wrap;gap:6px}.seg .btn{padding:7px 13px;font-size:12px}
.seg .btn.on{background:linear-gradient(180deg,rgba(110,175,255,.8),rgba(10,108,255,.35));color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.orb{background:radial-gradient(circle at 50% 120%,rgba(var(--c),.5),rgba(var(--c),0) 60%),radial-gradient(circle at 30% 18%,rgba(255,255,255,.6),rgba(255,255,255,0) 38%),rgba(var(--c),.05);backdrop-filter:none;-webkit-backdrop-filter:none;border:1.5px solid rgba(255,255,255,.9);box-shadow:inset 0 4px 8px rgba(255,255,255,.95),inset 0 -12px 24px rgba(var(--c),.3),inset 0 0 0 6px rgba(255,255,255,.07),0 0 50px rgba(var(--c),.4),0 16px 36px rgba(0,0,0,.08)}
.orb::before{background:linear-gradient(180deg,#fff,rgba(255,255,255,0));opacity:.9}
nav{background:linear-gradient(135deg,rgba(255,255,255,.3),rgba(255,255,255,.04));backdrop-filter:blur(10px) saturate(240%) brightness(1.1);-webkit-backdrop-filter:blur(10px) saturate(240%) brightness(1.1);border:1px solid rgba(255,255,255,.85);box-shadow:inset 0 2px 2px #fff,inset 0 -2px 4px rgba(255,255,255,.4),inset 0 0 18px rgba(255,255,255,.25),0 10px 30px rgba(40,60,100,.16)}
nav::before{content:"";position:absolute;left:10%;right:10%;top:2px;height:45%;border-radius:99px;background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,255,255,0));pointer-events:none}
nav::after{content:"";position:absolute;left:25%;right:25%;bottom:2px;height:12%;border-radius:99px;background:radial-gradient(ellipse,rgba(255,255,255,.6),transparent 70%);pointer-events:none}
nav button:nth-of-type(1){--r:255,69,58}nav button:nth-of-type(2){--r:10,108,255}nav button:nth-of-type(3){--r:232,165,0}nav button:nth-of-type(4){--r:40,190,100}
nav button{color:rgb(var(--r));opacity:.72}nav button.on{color:rgb(var(--r));opacity:1}nav svg{stroke-width:2.1}
#ind{background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(var(--ir,255,69,58),.22));box-shadow:inset 0 1.5px 1px #fff,0 4px 16px rgba(var(--ir,255,69,58),.3);transition:transform .6s cubic-bezier(.3,1.5,.5,1),width .35s cubic-bezier(.3,1.4,.5,1),background .4s,box-shadow .4s}
.nt{margin:10px 0 0;font-size:16px;letter-spacing:-.01em}
.pr{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.pr .chip{background:rgba(255,255,255,.4);color:var(--ink);border:1px solid var(--gb)}
.tb.prep{background:rgba(40,190,100,.16);border:1px dashed rgba(40,190,100,.65)}.tb.rm{background:rgba(255,165,0,.16);border:1px solid rgba(255,165,0,.5)}
.note{position:relative}.note h3{margin:0 0 2px;font-size:15px;padding-right:44px}.ibtn{position:absolute;right:12px;top:12px;width:34px;height:34px}.ibtn svg{width:16px;height:16px}
.sum{margin-top:10px;border-radius:14px;padding:10px 12px;font-size:13px;line-height:1.5}
@media(max-width:820px){.cal{grid-template-columns:1fr}.cell{min-height:54px;padding:6px;border-radius:14px}.dow,.grid{gap:5px}.bdg{right:4px;top:6px}.card{padding:16px}h1{font-size:22px}.sbox{margin-top:8vh}}
</style></head><body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<main>
<section class="page on" id="p0"><div class="cal">
 <div class="card glass"><div class="row sp"><h1 id="mt"></h1><div class="row"><button class="btn glass ic" id="pv" aria-label="Previous month"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button><button class="btn glass" id="td">Today</button><button class="btn glass ic" id="nx" aria-label="Next month"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button><button class="btn pri ic" id="add" aria-label="Add event"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div></div>
 <div class="dow"><span>SUN</span><span>MON</span><span>TUE</span><span>WED</span><span>THU</span><span>FRI</span><span>SAT</span></div><div class="grid" id="gr"></div></div>
 <div class="card glass"><div class="row sp"><h2 id="dt"></h2></div><div class="row sp" style="margin-top:12px"><span class="mut" style="font-size:13px" id="cnt"></span><button class="btn glass" id="add2">+ Add to Day</button></div><div id="evl"></div></div>
</div></section>
<section class="page" id="p1"><div class="sbox glass row"><input id="q" placeholder="Search your voice notes" autocomplete="off" enterkeyhint="search"><button class="btn pri ic" id="sb" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button></div><div class="res" id="res"></div></section>
<section class="page" id="p2"><div class="rtop"><h1>Ramble Mode</h1>
 <button class="orb" id="orb" aria-label="Record voice note"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg></button>
 <p class="mut" id="st" style="margin:0 0 18px;font-size:14px">Tap the microphone to start</p>
 <div class="live glass" id="live" aria-live="polite"></div><p class="mut" style="font-size:13px;margin-top:26px">Scroll down to read your saved voice notes</p></div>
 <div class="notes"><h2>Your voice notes</h2><div id="nl"></div></div></section>
<section class="page" id="p3"><div class="tt card glass"><div class="row sp"><h1 id="ttt"></h1><div class="row"><button class="btn glass ic" id="tp" aria-label="Previous day"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button><button class="btn glass" id="tt0">Today</button><button class="btn glass ic" id="tn" aria-label="Next day"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button></div></div><div id="ad"></div><div id="hrs"></div></div></section>
</main>
<nav class="glass" id="nav"><span id="ind"></span>
<button class="on" aria-label="Calendar"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg></button>
<button aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
<button aria-label="Ramble mode"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg></button>
<button aria-label="Timetable"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M4 10h16M4 15h16M10 4v16M15 4v16"/></svg></button></nav>
<div class="mask" id="mk"><div class="card glass"><div class="row sp"><h2>Schedule New Event</h2><button class="btn glass ic" id="cl" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
<label class="lbl">Event title</label><input class="fld glass" id="f-t" placeholder="Eg: Meeting, Project, etc.">
<label class="lbl">Date</label><input class="fld glass" id="f-d" type="date">
<label class="lbl">Event type</label><div class="seg" id="s-ty"><button class="btn glass on">Work</button><button class="btn glass">Birthdays</button><button class="btn glass">Personal</button><button class="btn glass">Reminder</button></div>
<label class="lbl">Recurring schedule</label><div class="seg" id="s-rc"><button class="btn glass on">One-time</button><button class="btn glass">Daily</button><button class="btn glass">Weekly</button><button class="btn glass">Monthly</button><button class="btn glass">Yearly</button></div>
<label class="lbl">Time slot</label><div class="seg" id="s-tm"><button class="btn glass on">Specific Hours</button><button class="btn glass">All Day</button></div>
<div class="two" id="hrsf"><div><label class="lbl">Start hour</label><input class="fld glass" id="f-s" type="time" value="09:00"></div><div><label class="lbl">End hour</label><input class="fld glass" id="f-e" type="time" value="10:30"></div></div>
<label class="lbl">Notes / details</label><textarea class="fld glass" id="f-n" rows="2" placeholder="Add location, gift ideas, or agenda..."></textarea>
<label class="lbl">Attach files (PDF, Word, text)</label><input class="fld glass" id="f-f" type="file" accept=".pdf,.docx,.txt,.md,.csv" multiple>
<div class="row" style="justify-content:flex-end;margin-top:18px"><button class="btn glass" id="cn">Cancel</button><button class="btn pri" id="sv">Save Event to Calendar</button></div></div></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let evs=ld('rc_ev',[]),notes=ld('rc_notes',[]);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const par=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const t12=t=>{const[h,m]=t.split(':').map(Number);return(h%12||12)+':'+String(m).padStart(2,'0')+' '+(h<12?'AM':'PM')};
const todayS=iso(new Date());let sel=todayS,mon=par(todayS),ttd=todayS;mon.setDate(1);
const occ=(e,s)=>{if(s<e.date)return false;const a=par(e.date),b=par(s);
 if(e.rec==='One-time')return s===e.date;if(e.rec==='Daily')return true;
 if(e.rec==='Weekly')return a.getDay()===b.getDay();if(e.rec==='Monthly')return a.getDate()===b.getDate();
 return a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()};
const on=s=>evs.filter(e=>occ(e,s)).sort((a,b)=>(b.all-a.all)||(a.start||'').localeCompare(b.start||''));
const lt=s=>par(s).toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric',year:'numeric'});
function evHtml(e,del){return `<div class="ev glass"><div class="row sp"><b>${esc(e.title)}</b><span class="chip">${esc(e.type)}</span></div><div class="mut" style="margin-top:4px">${e.all?'All day':t12(e.start)+' to '+t12(e.end)}${e.rec!=='One-time'?' · '+e.rec:''}</div>${e.notes?`<div style="margin-top:6px">${esc(e.notes)}</div>`:''}${del?`<button class="btn glass" style="margin-top:8px;padding:5px 12px;font-size:12px" data-del="${e.id}">Delete</button>`:''}</div>`}
function calR(){
 $('#mt').textContent=mon.toLocaleDateString('en-US',{month:'long',year:'numeric'});
 const st=new Date(mon);st.setDate(1-mon.getDay());let h='';
 for(let i=0;i<42;i++){const d=new Date(st);d.setDate(st.getDate()+i);const s=iso(d),n=on(s).length;
  h+=`<div class="cell glass${d.getMonth()!==mon.getMonth()?' o':''}${s===sel?' sel':''}${s===todayS?' today':''}" data-d="${s}"><span class="n">${d.getDate()}</span>${n?`<span class="bdg">${n}</span>`:''}</div>`}
 $('#gr').innerHTML=h;
 const l=on(sel);$('#dt').textContent=lt(sel);$('#cnt').textContent=l.length+' event(s) scheduled';
 $('#evl').innerHTML=l.length?l.map(e=>evHtml(e,1)).join(''):`<div class="empty glass"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><p style="margin:8px 0 4px"><b>No events on this day</b></p><span class="mut" style="font-size:12px">Use the + button to schedule an event, birthday, or recurring reminder.</span></div>`}
function ttR(){
 $('#ttt').textContent=par(ttd).toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric',year:'numeric'});
 const l=on(ttd);$('#ad').innerHTML=l.filter(e=>e.all).map(e=>`<div class="tb" style="margin-top:12px"><b>${esc(e.title)}</b> · All day</div>`).join('');
 let h='';for(let H=5;H<=24;H++){const hs=l.filter(e=>!e.all&&Math.min(24,Math.max(5,+e.start.split(':')[0]||24))===H);
  h+=`<div class="hr glass"><div class="t">${H===24?'12:00 AM':t12(H+':00')}</div><div>${hs.map(e=>`<div class="tb"><b>${esc(e.title)}</b> <span class="mut">${t12(e.start)} to ${t12(e.end)}</span></div>`).join('')}</div></div>`}
 $('#hrs').innerHTML=h}
/* nav */

async function search(){const q=$('#q').value.trim(),R=$('#res');if(!q)return;
 if(!notes.length){R.innerHTML="<p class='mut' style='text-align:center'>You have no voice notes yet. Record one in Ramble Mode first.</p>";return}
 R.innerHTML="<p class='mut' style='text-align:center'>Searching by meaning...</p>";let hits=null;
 const r=await ai('You rank voice notes against a search query by meaning, not exact wording (for example a query about a map for blind people matches a note about accessibility maps). Use each note title, summary and text. Query: '+JSON.stringify(q)+NL+'Notes: '+JSON.stringify(notes.map(n=>({id:n.id,title:n.title||'',summary:n.summary||'',text:n.text.slice(0,600)})))+NL+'Return only a JSON array of ids, most relevant first, leaving out irrelevant notes. Return [] if none are relevant.');
 if(Array.isArray(r))hits=r.map(id=>notes.find(n=>n.id==id)).filter(Boolean);
 if(!hits){const w=q.toLowerCase().split(' ').filter(x=>x.length>2),sc=n=>{const h=(nm(n)+' '+(n.summary||'')+' '+n.text).toLowerCase();return w.filter(k=>h.includes(k)).length};hits=notes.filter(n=>sc(n)>0).sort((a,b)=>sc(b)-sc(a))}
 R.innerHTML=hits.length?hits.map(n=>nc(n)).join(''):"<p class='mut' style='text-align:center'>No matching voice notes found.</p>"}
